[package]
name = "PinPoint"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
